name: shopback-todo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Runs golang-migrate with the migrations mounted read-only.
  # Usage: docker compose run --rm migrate up|down 1|version
  migrate:
    image: migrate/migrate:v4.19.0
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:-todo_dev_password}@db:5432/${POSTGRES_DB:-todo}?sslmode=disable
    command: ["up"]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
